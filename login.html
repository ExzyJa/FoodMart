<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | FoodMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/vendor.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <header class="auth-header border-bottom">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <a href="index.html"><img src="images/logo.png" alt="FoodMart" class="img-fluid" style="max-width: 180px"></a>
      <a class="text-decoration-none" href="register.html">Create account</a>
    </div>
  </header>
  <main class="auth-shell">
    <div class="container">
      <section class="auth-panel">
        <span class="auth-badge badge rounded-pill mb-3">Welcome back</span>
        <h1 class="h2 mb-2">Log in to FoodMart</h1>
        <p class="text-muted mb-4">Access your account and keep your grocery list close.</p>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="login-email">Gmail address</label>
            <input class="form-control" id="login-email" type="email" placeholder="you@gmail.com" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-control" id="login-password" type="password" autocomplete="current-password" required>
          </div>
          <div id="login-message" class="alert d-none" role="alert"></div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Log in</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0">New to FoodMart? <a href="register.html">Register with Gmail</a></p>
      </section>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
