<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | FoodMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/vendor.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <header class="auth-header border-bottom">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <a href="index.html"><img src="images/logo.png" alt="FoodMart" class="img-fluid" style="max-width: 180px"></a>
      <a class="text-decoration-none" href="login.html">Log in</a>
    </div>
  </header>
  <main class="auth-shell">
    <div class="container">
      <section class="auth-panel">
        <span class="auth-badge badge rounded-pill mb-3">Fresh start</span>
        <h1 class="h2 mb-2">Create your account</h1>
        <p class="text-muted mb-4">Use your Gmail address to verify your FoodMart account.</p>
        <form id="register-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="register-name">Full name</label>
            <input class="form-control" id="register-name" type="text" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="register-email">Gmail address</label>
            <input class="form-control" id="register-email" type="email" placeholder="you@gmail.com" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="register-password">Password</label>
            <input class="form-control" id="register-password" type="password" minlength="8" autocomplete="new-password" required>
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="register-confirm">Confirm password</label>
            <input class="form-control" id="register-confirm" type="password" autocomplete="new-password" required>
          </div>
          <div id="register-message" class="alert d-none" role="alert"></div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Send verification email</button>
        </form>
        <div id="verification-panel" class="d-none">
          <div class="alert alert-info" role="status">A verification link has been sent to your Gmail address. Open it, then return here.</div>
          <form id="verification-form" novalidate>
            <div id="verification-message" class="alert d-none" role="alert"></div>
            <button class="btn btn-primary btn-lg w-100" type="submit">I verified my email</button>
            <button id="resend-verification" class="btn btn-link w-100 mt-2" type="button">Resend verification email</button>
          </form>
        </div>
        <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="login.html">Log in</a></p>
      </section>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
